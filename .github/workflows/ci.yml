name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built package is importable
        run: |
          node -e "
            const { parsePartial } = require('./dist/index.cjs');
            const got = JSON.stringify(parsePartial('{\"a\": [1, 2], \"b\": \"hel'));
            if (got !== '{\"a\":[1],\"b\":\"hel\"}') {
              throw new Error('CJS smoke test returned ' + got);
            }
          "
          node --input-type=module -e "
            import { parsePartial } from './dist/index.js';
            const got = JSON.stringify(parsePartial('{\"a\": [1, 2], \"b\": \"hel'));
            if (got !== '{\"a\":[1],\"b\":\"hel\"}') {
              throw new Error('ESM smoke test returned ' + got);
            }
          "

  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails the job if the score drops below the `break` threshold in
      # stryker.config.json. A coverage badge says the lines ran; this says the
      # tests would actually notice if the code were wrong.
      - name: Run Stryker
        run: npm run mutation

      - name: Publish score to the job summary
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'));
              const counts = { Killed: 0, Survived: 0, Timeout: 0, NoCoverage: 0, Ignored: 0, CompileError: 0, RuntimeError: 0 };
              for (const file of Object.values(report.files)) {
                for (const mutant of file.mutants) {
                  counts[mutant.status] = (counts[mutant.status] ?? 0) + 1;
                }
              }
              const detected = counts.Killed + counts.Timeout;
              const valid = detected + counts.Survived + counts.NoCoverage;
              const score = valid === 0 ? 0 : (detected / valid) * 100;
              const lines = [
                '## Mutation score: ' + score.toFixed(2) + '%',
                '',
                '| Status | Count |',
                '| --- | ---: |',
                ...Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) => '| ' + k + ' | ' + n + ' |'),
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
              console.log('Mutation score: ' + score.toFixed(2) + '%');
            "
          else
            echo 'No mutation report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
