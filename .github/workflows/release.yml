name: Release

# Publishing is a button, not a terminal session: push a tag (or use the
# "Run workflow" button on this workflow), and npm gets the package.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup, both doable from a phone browser:
#   1. Create an npm automation token, then add it as the repository secret
#      NPM_TOKEN under Settings → Secrets and variables → Actions.
#   2. Nothing else. Provenance is signed with the workflow's OIDC identity,
#      which is why `id-token: write` is requested below — it publishes a
#      verifiable link from the tarball on npm back to this exact commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # Never ship a red build.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG." >&2
            echo "Bump the version in package.json, or retag." >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
