name: Release

# Publishing is a button, not a terminal session: cut a GitHub Release with a
# `v*` tag, and npm gets the package.
#
# Authentication is npm Trusted Publishing (OIDC). There is no token here and
# no NPM_TOKEN secret: GitHub mints a short-lived credential for this specific
# workflow run, and npm accepts it because the package's trusted-publisher
# settings name this repository and this workflow file. Nothing long-lived
# exists to leak, expire, or rotate.
#
# The trust relationship lives on npm, at
# npmjs.com/package/json-so-far → Settings → Trusted Publisher:
#   organization/user: tamerkalla
#   repository:        json-so-far
#   workflow:          release.yml
#
# Renaming this file, the repo, or the owner breaks publishing until that
# config is updated to match.

# Releasing is a version bump. Change `version` in package.json, push to main,
# and this publishes to npm and creates the matching tag and GitHub Release on
# its own. Pushes that do not change the version cost about a minute and skip
# the publish, because the check is "is this version on npm yet", not "did this
# commit touch package.json".
#
# The `v*` tag trigger is kept so a hand-cut tag still works.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and GitHub Release
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Node 22 ships npm 10.x; Trusted Publishing needs 11.5.1+. Without this
      # the publish step fails with an authentication error rather than
      # anything that points at the npm version.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Never ship a red build.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG." >&2
            echo "Bump the version in package.json, or retag." >&2
            exit 1
          fi

      # Makes the workflow idempotent. npm rejects republishing a version that
      # already exists, which would turn any re-run into a red build — running
      # a release twice is a no-op, not an error, and it should look like one.
      # It also means tagging a version that was already published (say, after
      # a manual dispatch) reports green and simply skips the publish.
      - name: Check whether this version is already on npm
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published — skipping." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CODE" = "404" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $NAME@$VERSION." >> "$GITHUB_STEP_SUMMARY"
          else
            # Don't silently skip on a registry hiccup — fail loudly instead.
            echo "Unexpected status $CODE from the npm registry." >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: the OIDC identity granted by `id-token: write`
      # above is the credential. Provenance is signed with that same identity,
      # publishing a verifiable link from the tarball on npm back to this commit.
      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public

      # Only after a successful publish, so the tag never points at something
      # that failed to ship. Skipped when the run was itself started by a tag,
      # which would already have created it.
      #
      # `gh release create` makes the tag and the Release together. Using
      # GITHUB_TOKEN is deliberate: releases it creates do not trigger further
      # workflow runs, so this cannot re-enter the workflow.
      - name: Tag and create the GitHub Release
        if: >-
          steps.published.outputs.already == 'false' &&
          !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grabbing = 1; next }
            grabbing && /^## \[/     { exit }
            grabbing                 { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See CHANGELOG.md."
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "$NOTES"
          echo "Created release v$VERSION." >> "$GITHUB_STEP_SUMMARY"
